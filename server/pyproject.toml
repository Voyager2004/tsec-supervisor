[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tsec-supervisor-server"
version = "0.4.0"
description = "TsecBench local-mode competition telemetry collector"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools]
packages = ["app", "app.ip2region"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]
"app.ip2region" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/ip2region"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
